<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Booking Calendar - Daci Pickle Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="icon" href="logo.jpeg" type="image/jpeg" />
  <style>
    :root {
      --bg: #08090c;
      --surface: #0f1319;
      --surface-soft: #171c25;
      --text-primary: #f3f4f6;
      --text-secondary: #94a3b8;
      --accent: #ec4899;
      --accent-deep: #be185d;
      --border: rgba(255,255,255,0.08);
      --success: #10b981;
      --warning: #f59e0b;
      --training-cyan: #22d3ee;
      --training-cyan-soft: rgba(34, 211, 238, 0.12);
      --glow-pink: rgba(236,72,153,0.16);
      --glow-mint: rgba(139,195,74,0.12);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      background: radial-gradient(circle at 12% 10%, var(--glow-pink) 0%, transparent 18%),
                  radial-gradient(circle at 88% 80%, var(--glow-mint) 0%, transparent 22%),
                  linear-gradient(180deg, #07080b 0%, #181d27 100%);
      color: var(--text-primary);
      min-height: 100vh;
      padding: 24px;
    }

    .page {
      max-width: 1200px;
      margin: 0 auto;
      background: rgba(15, 19, 25, 0.93);
      border: 1px solid var(--border);
      border-radius: 20px;
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.35);
      overflow: hidden;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      padding: 28px 26px;
      gap: 12px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      background: rgba(255,255,255,0.03);
      border-top-left-radius: 20px;
      border-top-right-radius: 20px;
    }

    .topbar h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 2rem;
      letter-spacing: -0.6px;
      margin-bottom: 4px;
    }

    .topbar p {
      color: var(--text-secondary);
      margin-top: 4px;
      font-size: 0.95rem;
    }

    .btn {
      border: none;
      padding: 12px 18px;
      border-radius: 12px;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      color: white;
      background: linear-gradient(135deg, var(--accent-deep), var(--accent));
      box-shadow: 0 18px 30px rgba(236,72,153,0.18);
      transition: transform 0.18s ease, box-shadow 0.18s ease;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 20px 34px rgba(236,72,153,0.22);
    }

    .content {
      display: none;
    }

    .schedule-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
      flex-wrap: wrap;
      margin: 0 0 18px;
      padding-bottom: 8px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }

    .schedule-header-left {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .schedule-label {
      font-size: 0.9rem;
      color: var(--text-secondary);
      font-weight: 600;
    }

    .schedule-summary {
      color: var(--text-secondary);
      font-size: 0.95rem;
      display: flex;
      flex-wrap: wrap;
      gap: 8px 18px;
    }

    .schedule-summary span {
      white-space: nowrap;
    }

    .schedule-summary strong {
      color: var(--text-primary);
      font-weight: 700;
    }

    .schedule-summary .court-one-total strong {
      color: #fbbf24;
    }

    .schedule-summary .training-court-total strong {
      color: var(--training-cyan);
    }

    .schedule-summary .overall-total strong {
      color: #fb7185;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .block-times-modal {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 10;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(0, 0, 0, 0.7);
    }

    .block-times-panel {
      width: min(720px, 100%);
      max-height: 90vh;
      overflow: auto;
      padding: 24px;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: var(--surface);
    }

    .block-times-panel header,
    .block-times-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .block-times-panel h2 { font-size: 1.25rem; }
    .block-times-panel label { display: block; margin: 18px 0 8px; color: var(--text-secondary); }
    .block-times-panel input[type="date"] { padding: 10px; background: var(--surface-soft); color: var(--text-primary); border: 1px solid var(--border); border-radius: 8px; }
    .block-times-options { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin: 20px 0; }
    .block-time-option { display: flex !important; align-items: center; gap: 12px; margin: 0 !important; padding: 14px 16px; border: 1px solid rgba(255,255,255,0.08); border-radius: 10px; cursor: pointer; transition: all 0.22s ease; background: rgba(255,255,255,0.02); font-weight: 500; }
    .block-time-option:hover { background: rgba(255,255,255,0.05); border-color: rgba(255,255,255,0.12); }
    .block-time-option input { appearance: none; width: 20px; height: 20px; border: 2px solid rgba(255,255,255,0.2); border-radius: 6px; cursor: pointer; transition: all 0.22s ease; background: rgba(255,255,255,0.03); }
    .block-time-option input:hover { border-color: rgba(255,255,255,0.35); }
    .block-time-option input:checked { background: #dc2626; border-color: #dc2626; position: relative; }
    .block-time-option input:checked::after { content: '✓'; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: white; font-size: 12px; font-weight: bold; }
    .block-time-option:has(input:checked) { background: rgba(220, 38, 38, 0.08); border-color: rgba(220, 38, 38, 0.3); }
    .block-times-note { color: var(--text-secondary); font-size: 0.85rem; }
    .close-block-times { border: 0; background: transparent; color: var(--text-secondary); font-size: 1.5rem; cursor: pointer; }

    .schedule-input {
      width: 160px;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.08);
      background: rgba(255,255,255,0.03);
      color: var(--text-primary);
      font-family: 'Inter', sans-serif;
    }

    .btn-secondary {
      background: rgba(255,255,255,0.06);
      color: var(--text-primary);
      border: 1px solid rgba(255,255,255,0.1);
    }

    .btn-secondary:hover {
      background: rgba(255,255,255,0.09);
    }

    .schedule-card {
      background: rgba(15, 19, 25, 0.92);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 28px;
      padding: 24px;
      box-shadow: 0 32px 90px rgba(0, 0, 0, 0.30);
      backdrop-filter: blur(16px);
      margin: 20px;
    }

    .schedule-table {
      display: grid;
      gap: 14px;
      overflow-x: auto;
      padding-bottom: 10px;
      width: 100%;
    }

    .bottom-day-navigation {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-top: 18px;
    }

    .bottom-day-navigation button {
      min-width: 152px;
      padding: 11px 16px;
      border-radius: 10px;
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.01em;
      transition: background 0.18s ease, border-color 0.18s ease, transform 0.18s ease;
    }

    .bottom-day-navigation button:hover {
      transform: translateY(-1px);
      background: rgba(255,255,255,0.1);
      border-color: rgba(255,255,255,0.2);
    }

    .bottom-day-navigation button:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }

    @media (max-width: 520px) {
      .bottom-day-navigation button {
        min-width: 0;
        flex: 1;
        padding-inline: 10px;
      }
    }

    .slot-header,
    .slot-row {
      display: grid;
      grid-template-columns: 120px minmax(160px, 1fr) minmax(160px, 1fr);
      gap: 16px;
      align-items: stretch;
      min-width: 100%;
      width: 100%;
      grid-auto-rows: minmax(88px, auto);
    }

    .slot-header {
      padding: 18px 16px;
      border-radius: 20px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.08);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.03);
    }

    .slot-cell {
      min-width: 0;
      padding: 0;
      background: transparent;
      border: none;
      overflow: hidden;
      display: flex;
      align-items: stretch;
      justify-content: stretch;
    }

    .slot-cell.time-cell {
      padding: 16px 18px;
      min-width: 140px;
      justify-content: center;
      background: rgba(255,255,255,0.05);
      border-radius: 18px;
    }

    .slot-cell > .booking-slot,
    .slot-cell > .available-cell {
      width: 100%;
      min-height: 100%;
      padding: 18px;
      border-radius: 20px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.03);
      display: flex;
      flex-direction: column;
      justify-content: center;
      position: relative;
      z-index: 0;
    }

    .slot-cell > .available-cell {
      background: rgba(255,255,255,0.02);
      border: 1px dashed rgba(255,255,255,0.08);
      color: var(--text-secondary);
      align-items: center;
    }

    .time-cell {
      min-width: 160px;
      white-space: normal;
      overflow: visible;
      text-overflow: clip;
      font-weight: 600;
      color: var(--accent);
    }

    .slot-heading {
      font-size: 0.85rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-secondary);
      background: rgba(255,255,255,0.05);
      padding: 12px 14px;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,0.08);
    }

    .slot-heading.training-court-heading {
      color: var(--training-cyan);
      background: var(--training-cyan-soft);
      border-color: rgba(34, 211, 238, 0.35);
    }

    .slot-cell.training-court-cell {
      background: rgba(34, 211, 238, 0.035);
      border-radius: 18px;
    }

    .training-court-cell .available-cell {
      border-color: rgba(34, 211, 238, 0.22);
    }

    .training-court-cell .booking-slot {
      border-color: rgba(34, 211, 238, 0.35);
    }

    .slot-row:hover .slot-cell > .booking-slot {
      transform: translateY(-1px);
    }

    .slot-row:hover .slot-cell > .booking-slot {
      transform: translateY(-1px);
    }

    .court-columns,
    .court-panel,
    .court-title {
      display: none;
    }

    .booking-slot {
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-height: 90px;
      padding: 0;
      border-radius: 0;
      background: transparent;
      border: none;
      box-shadow: none;
    }

    .booking-slot h4 {
      margin: 0;
      font-size: 0.94rem;
      color: white;
      letter-spacing: -0.02em;
    }

    .booking-slot .slot-meta {
      color: var(--text-secondary);
      font-size: 0.72rem;
      display: grid;
      gap: 4px;
    }

    .booking-slot .slot-meta span {
      display: block;
      line-height: 1.3;
    }

    .booking-slot .slot-meta span:first-child {
      color: var(--text-primary);
      font-size: 0.84rem;
      font-weight: 600;
    }

    .available-cell {
      min-height: 72px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-secondary);
      background: rgba(255,255,255,0.02);
      border: 1px dashed rgba(255,255,255,0.08);
    }

    @media (max-width: 900px) {
      body {
        padding: 12px;
      }
      .page {
        margin: 0;
        width: 100%;
        border-radius: 0;
      }
      .schedule-card {
        margin: 0;
        width: 100%;
        padding: 18px 14px 20px;
        border-radius: 0 0 20px 20px;
      }
      .content { grid-template-columns: 1fr; }
      .schedule-table {
        display: block;
        width: 100%;
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
        padding-bottom: 10px;
      }
      .slot-row,
      .slot-header {
        display: grid;
        grid-template-columns: 76px minmax(104px, 1fr) minmax(104px, 1fr);
        gap: 16px;
        min-width: 340px;
      }
      .slot-header {
        padding: 10px 8px;
        border-radius: 16px;
      }
      .slot-heading,
      .slot-cell {
        padding: 0;
      }
      .slot-heading {
        font-size: 0.68rem;
        text-align: center;
        padding: inherit;
      }
      .slot-cell {
        width: 100%;
        min-width: 0;
      }
      .slot-cell.time-cell {
        padding: 16px 18px;
        min-width: 80px;
        justify-content: center;
        background: rgba(255, 255, 255, 0.05);
        border-radius: 18px;
      }
      .slot-cell > .booking-slot,
      .slot-cell > .available-cell {
        padding: 8px;
      }
      .time-cell {
        min-width: 0;
        white-space: normal;
        word-break: break-word;
        line-height: 1.1;
        font-size: 0.72rem;
      }
      .booking-slot {
        min-height: 50px;
        gap: 6px;
      }
      .booking-slot h4 {
        font-size: 0.72rem;
      }
      .booking-slot .slot-meta {
        font-size: 0.62rem;
      }
      .booking-slot .slot-meta span:first-child {
        font-size: 0.78rem;
      }
      .booking-slot .slot-meta span {
        line-height: 1.2;
      }
      .topbar h1 {
        font-size: 1.35rem;
      }
      .schedule-summary {
        font-size: 0.78rem;
      }
      .schedule-input,
      .header-actions button,
      .btn {
        font-size: 0.78rem;
      }
      .btn {
        padding: 6px 8px;
      }
      .schedule-input {
        padding: 8px 10px;
      }
      .topbar {
        gap: 12px;
      }
      .header-actions {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: flex-start;
        gap: 8px;
      }
      .header-actions #refreshBtn {
        order: 1;
        margin-left: auto;
      }
      .schedule-input {
        flex: 1 1 100%;
        min-width: 120px;
      }
      .schedule-summary {
        font-size: 0.88rem;
      }
      .header-actions button,
      .btn {
        font-size: 0.85rem;
        padding: 8px 10px;
      }
      .schedule-table::-webkit-scrollbar {
        height: 8px;
      }
      .schedule-table::-webkit-scrollbar-track {
        background: transparent;
      }
      .schedule-table::-webkit-scrollbar-thumb {
        background: rgba(255,255,255,0.15);
        border-radius: 999px;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="topbar">
      <div>
        <h1>Booking Calendar</h1>
        <p>View scheduled bookings at a glance.</p>
      </div>
    </div>

    <div class="schedule-card">
        <div class="schedule-header">
          <div class="schedule-header-left">
            <div class="schedule-label">Booking Schedule</div>
            <div class="schedule-summary" id="scheduleSummary">Loading bookings...</div>
          </div>
          <div class="header-actions">
            <button class="btn-secondary" id="prevDayBtn">←</button>
            <button class="btn-secondary" id="todayBtn">Today</button>
            <button class="btn-secondary" id="nextDayBtn">→</button>
            <input type="date" id="scheduleDate" class="schedule-input" />
            <button class="btn" id="refreshBtn">Refresh</button>
          </div>
        </div>

        <div class="schedule-table" id="scheduleTable"></div>
        <div class="bottom-day-navigation" aria-label="Change booking date">
          <button class="btn-secondary" id="prevDayBottomBtn" type="button">← Previous date</button>
          <button class="btn-secondary" id="nextDayBottomBtn" type="button">Next date →</button>
        </div>
      </div>

      <div class="block-times-modal" id="blockTimesModal" role="dialog" aria-modal="true" aria-labelledby="blockTimesTitle">
        <div class="block-times-panel">
          <header>
            <h2 id="blockTimesTitle">Block timeslots</h2>
            <button class="close-block-times" id="closeBlockTimesBtn" aria-label="Close">×</button>
          </header>
          <label for="blockTimesDate">Date</label>
          <input type="date" id="blockTimesDate" />
          <p class="block-times-note">Select one or more court times to make unavailable for bookings.</p>
          <div id="blockTimesOptions" class="block-times-options"></div>
          <div class="block-times-footer">
            <button class="btn-secondary" id="cancelBlockTimesBtn">Cancel</button>
            <button class="btn" id="saveBlockTimesBtn">Save blocked times</button>
          </div>
        </div>
      </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script>
    let bookings = [];
    let selectedDate = null;
    let supabaseClient = null;
    let blockedTimes = [];

    const scheduleDateInput = document.getElementById('scheduleDate');
    const scheduleSummary = document.getElementById('scheduleSummary');
    const scheduleTable = document.getElementById('scheduleTable');
    const blockTimesModal = document.getElementById('blockTimesModal');
    const blockTimesDateInput = document.getElementById('blockTimesDate');
    const blockTimesOptions = document.getElementById('blockTimesOptions');

    function formatSlot(hour) {
      const start = new Date(2000, 0, 1, hour);
      const end = new Date(start.getTime() + 60 * 60 * 1000);
      const options = { hour: 'numeric', minute: '2-digit' };
      return `${start.toLocaleTimeString('en-US', options)} - ${end.toLocaleTimeString('en-US', options)}`;
    }

    function openBlockTimes() {
      blockTimesDateInput.value = selectedDate || scheduleDateInput.value;
      blockTimesModal.style.display = 'flex';
      renderBlockTimeOptions();
    }

    function closeBlockTimes() {
      blockTimesModal.style.display = 'none';
    }

    function renderBlockTimeOptions() {
      const courtKey = court => isCourtTwo(court) ? 'Court 2' : 'Court One';
      const booked = new Set(bookings.map(item => `${courtKey(item.court || item.court_name)}|${parseHour(item.time_slot || item.booking_time)}`));
      const blocked = new Set(blockedTimes.map(item => `${courtKey(item.court)}|${parseHour(item.time_slot)}`));
      blockTimesOptions.innerHTML = '';
      ['Court One', 'Court 2'].forEach(court => {
        for (let hour = 0; hour < 24; hour++) {
          const key = `${courtKey(court)}|${hour}`;
          const isBooked = booked.has(key);
          const label = document.createElement('label');
          label.className = 'block-time-option';
          label.innerHTML = `<input type="checkbox" data-court="${court}" value="${hour}"${blocked.has(key) ? ' checked' : ''}${isBooked ? ' disabled' : ''}>${court} · ${formatSlot(hour)}${isBooked ? ' · Booked' : ''}`;
          blockTimesOptions.appendChild(label);
        }
      });
    }

    async function saveBlockTimes() {
      const date = blockTimesDateInput.value;
      if (!date) return;
      const selected = [...blockTimesOptions.querySelectorAll('input:checked')].map(input => ({
        blocked_date: date,
        court: input.dataset.court,
        time_slot: formatSlot(Number(input.value))
      }));
      const { error: deleteError } = await supabaseClient.from('blocked_time_slots').delete().eq('blocked_date', date);
      if (deleteError) return alert('Could not update blocked timeslots. Run the Supabase migration first.');
      if (selected.length) {
        const { error } = await supabaseClient.from('blocked_time_slots').insert(selected);
        if (error) return alert('Could not save blocked timeslots.');
      }
      if (date === selectedDate) await loadBookings(date);
      closeBlockTimes();
    }

    function formatDate(dateString) {
      if (!dateString) return '—';
      const date = new Date(dateString + 'T00:00:00');
      return date.toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
    }

    function getBookingsForDate(dateKey) {
      return bookings.filter(item => item.booking_date === dateKey);
    }

    function parseHour(timeValue) {
      if (!timeValue) return null;
      const text = timeValue.toString().trim();
      const rangeParts = text.split('-').map(part => part.trim());
      const startText = rangeParts[0] || text;
      const match = startText.match(/(\d{1,2})(?::(\d{2}))?\s*(AM|PM)?/i);
      if (!match) return null;
      let hour = parseInt(match[1], 10);
      const minutes = parseInt(match[2] || '0', 10);
      const period = (match[3] || '').toUpperCase();
      if (period === 'PM' && hour < 12) hour += 12;
      if (period === 'AM' && hour === 12) hour = 0;
      return hour;
    }

    function formatTimeRange(hour) {
      const start = new Date();
      start.setHours(hour, 0, 0, 0);
      const end = new Date(start.getTime() + 60 * 60 * 1000);
      return `${start.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' })} - ${end.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' })}`;
    }

    function isPastSlot(dateKey, hour) {
      const today = new Date();
      const slotDate = new Date(dateKey + 'T00:00:00');
      if (slotDate < new Date(today.getFullYear(), today.getMonth(), today.getDate())) {
        return true;
      }
      if (slotDate > new Date(today.getFullYear(), today.getMonth(), today.getDate())) {
        return false;
      }
      return hour < today.getHours();
    }

    function isCourtTwo(value) {
      const court = String(value || '').trim().toLowerCase();
      const compact = court.replace(/[\s_-]+/g, '');
      return court.includes('training') || compact.includes('courttwo') || compact.includes('court2') || compact === '2';
    }

    function renderSchedule(dateKey) {
      const items = getBookingsForDate(dateKey);
      const label = formatDate(dateKey);
      const scheduleTable = document.getElementById('scheduleTable');

      const courtOne = items.filter(item => {
        const court = (item.court || item.court_name || '').toString().toLowerCase();
        return court.includes('court one') || court.includes('court1') || court === '1';
      });
      const courtTwo = items.filter(item => {
        const court = (item.court || item.court_name || '').toString().toLowerCase();
        return isCourtTwo(court);
      });

      scheduleSummary.innerHTML = `
        <span class="court-one-total">Court 1: <strong>${courtOne.length}</strong></span>
        <span class="training-court-total">Court 2: <strong>${courtTwo.length}</strong></span>
        <span class="overall-total">Overall: <strong>${items.length}</strong></span>
      `;

      const rows = [];
      const makeCell = (booking, hour, timeLabel) => {
        const court = booking?.court || '';
        if (!booking && blockedTimes.some(item => item.court === court && parseHour(item.time_slot) === hour)) {
          return '<div class="available-cell">Blocked</div>';
        }
        if (!booking) {
          if (isPastSlot(dateKey, hour)) {
            return '<div class="available-cell">Past</div>';
          }
          return '<div class="available-cell">Available</div>';
        }
        return `
          <div class="booking-slot">
            <h4>${booking.customer_name || 'Customer'}</h4>
            <div class="slot-meta">
              <span>${booking.phone_number || booking.phone || 'No Phone'}</span>
              <span>${booking.reference_code || 'No Ref'}</span>
            </div>
          </div>
        `;
      };

      for (let hour = 0; hour < 24; hour++) {
        const timeLabel = formatTimeRange(hour);
        const oneBooking = courtOne.find(item => parseHour(item.time_slot || item.booking_time) === hour);
        const twoBooking = courtTwo.find(item => parseHour(item.time_slot || item.booking_time) === hour);

        rows.push(`
          <div class="slot-row">
            <div class="slot-cell time-cell">${timeLabel}</div>
            <div class="slot-cell">${oneBooking ? makeCell(oneBooking, hour, timeLabel) : (blockedTimes.some(item => item.court === 'Court One' && parseHour(item.time_slot) === hour) ? '<div class="available-cell">Blocked</div>' : makeCell(oneBooking, hour, timeLabel))}</div>
            <div class="slot-cell training-court-cell">${twoBooking ? makeCell(twoBooking, hour, timeLabel) : (blockedTimes.some(item => isCourtTwo(item.court) && parseHour(item.time_slot) === hour) ? '<div class="available-cell">Blocked</div>' : makeCell(null, hour, timeLabel))}</div>
          </div>
        `);
      }

      scheduleTable.innerHTML = `
        <div class="slot-header">
          <div class="slot-heading">Time</div>
          <div class="slot-heading">Court 1</div>
          <div class="slot-heading training-court-heading">Court 2</div>
        </div>
        ${rows.join('')}
      `;
    }

    async function loadBookings(dateKey = selectedDate) {
      if (!dateKey) return;

      scheduleSummary.textContent = 'Loading bookings...';
      scheduleTable.innerHTML = '<div class="slot-header"><div class="slot-heading">Time</div><div class="slot-heading">Court 1</div><div class="slot-heading training-court-heading">Court 2</div></div>';

      const { data, error } = await supabaseClient
        .from('bookings')
        .select('id, reference_code, customer_name, phone_number, booking_date, time_slot, booking_time, court, court_name, status')
        .eq('booking_date', dateKey)
        .order('booking_date', { ascending: true });

      if (error) {
        console.error('Failed to load bookings:', error);
        scheduleSummary.textContent = 'Unable to load bookings';
        scheduleTable.innerHTML = '<div class="slot-cell">Unable to load bookings</div><div class="slot-cell"></div><div class="slot-cell"></div>';
        return;
      }

      const { data: blockedRows, error: blockedError } = await supabaseClient
        .from('blocked_time_slots')
        .select('court, time_slot')
        .eq('blocked_date', dateKey);
      if (blockedError) {
        console.error('Failed to load blocked times:', blockedError);
        blockedTimes = [];
      } else {
        blockedTimes = blockedRows || [];
      }

      bookings = (data || [])
        .filter(item => item.booking_date && item.status !== 'pending');

      selectedDate = dateKey;
      scheduleDateInput.value = dateKey;
      renderSchedule(dateKey);
    }

    async function initSchedule() {
      const supabaseConfig = window.SUPABASE_CONFIG || {};
      const SUPABASE_URL = supabaseConfig.url || 'https://mpkmtcdsubopnrpyqwel.supabase.co';
      const SUPABASE_ANON_KEY = supabaseConfig.anonKey || 'sb_publishable_UL5Bm_SqkJTmRSmcO_NdRA_1qoOksRk';

      if (!window.supabase) {
        scheduleSummary.textContent = 'Supabase library missing';
        scheduleTable.innerHTML = '<div class="slot-cell">Supabase library missing</div>';
        return;
      }

      supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      const prevDayBtn = document.getElementById('prevDayBtn');
      const nextDayBtn = document.getElementById('nextDayBtn');
      const prevDayBottomBtn = document.getElementById('prevDayBottomBtn');
      const nextDayBottomBtn = document.getElementById('nextDayBottomBtn');
      const todayBtn = document.getElementById('todayBtn');
      const refreshBtn = document.getElementById('refreshBtn');

      document.getElementById('closeBlockTimesBtn').addEventListener('click', closeBlockTimes);
      document.getElementById('cancelBlockTimesBtn').addEventListener('click', closeBlockTimes);
      document.getElementById('saveBlockTimesBtn').addEventListener('click', saveBlockTimes);
      blockTimesDateInput.addEventListener('change', async () => {
        if (!blockTimesDateInput.value) return;
        await loadBookings(blockTimesDateInput.value);
        renderBlockTimeOptions();
      });

      scheduleDateInput.addEventListener('change', async () => {
        selectedDate = scheduleDateInput.value;
        if (selectedDate) {
          await loadBookings(selectedDate);
        }
      });

      const changeDay = async (step) => {
        const current = new Date(scheduleDateInput.value || new Date());
        current.setDate(current.getDate() + step);
        selectedDate = current.toISOString().slice(0, 10);
        scheduleDateInput.value = selectedDate;
        await loadBookings(selectedDate);
      };

      prevDayBtn.addEventListener('click', () => changeDay(-1));
      nextDayBtn.addEventListener('click', () => changeDay(1));
      prevDayBottomBtn.addEventListener('click', () => changeDay(-1));
      nextDayBottomBtn.addEventListener('click', () => changeDay(1));

      todayBtn.addEventListener('click', async () => {
        const today = new Date();
        selectedDate = today.toISOString().slice(0, 10);
        scheduleDateInput.value = selectedDate;
        await loadBookings(selectedDate);
      });

      refreshBtn.addEventListener('click', async () => {
        await loadBookings(selectedDate || new Date().toISOString().slice(0, 10));
      });

      const today = new Date();
      selectedDate = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;
      await loadBookings(selectedDate);
    }

    initSchedule();
  </script>
</body>
